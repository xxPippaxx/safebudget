<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeBudget Pro</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><h1>💰 SafeBudget Pro</h1><div class="grid"><div class="card"><h3>Saldo</h3><div id="saldo">€0.00</div></div><div class="card"><h3>Entrate</h3><div id="entrate">€0.00</div></div><div class="card"><h3>Uscite</h3><div id="uscite">€0.00</div></div></div><div class="card"><h3>Nuovo movimento</h3><input id="desc" placeholder="Descrizione"><input id="amount" type="number" step="0.01"><select id="cat"><option>Stipendio</option><option>Alimentari</option><option>Auto</option><option>Casa</option><option>Svago</option></select><select id="type"><option>Entrata</option><option>Uscita</option></select><button id="add">Salva</button></div><div class="card"><button id="backup">Backup JSON</button><input id="restore" type="file"></div><div class="card"><h3>Movimenti</h3><table><thead><tr><th>Data</th><th>Cat.</th><th>Descrizione</th><th>€</th></tr></thead><tbody id="list"></tbody></table></div></div><script src="app.js"></script></body></html>
